[project]
name = "lojas_flask"
version = "2.0.0"
description = "Sistema de gerenciamento de produtos com Flask, SQLite e IA"
authors = [
    {name = "saturnbells", email = "brunoleandrobusiness@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.3",
    "python-dotenv>=1.0.1",
    "flask-limiter>=3.5.1",
    "pytest>=8.0.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/saturnbells/lojas_flask"
Repository = "https://github.com/saturnbells/lojas_flask"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"